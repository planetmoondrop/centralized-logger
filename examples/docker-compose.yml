# docker compose up --build
#
# Starts the full stack — observability infra + all four example apps.
# Build context for every app service is the repo root (..) so that
# file:../../packages/* references resolve inside Docker.
#
# Ports exposed on the host:
#   5173  frontend
#   3003  backend (gateway)
#   3001  auth-service
#   3002  customer-support
#   3000  Grafana
#   3100  Loki
#   3200  Tempo
#   9090  Prometheus

services:
  # ── Observability: Loki ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../docker/services/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - planetmoondrop

  # ── Observability: Tempo ───────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '3200:3200'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ../docker/services/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - planetmoondrop

  # ── Observability: Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../docker/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planetmoondrop

  # ── Observability: Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.7
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: correlations traceToMetrics
      GF_EXPLORE_ENABLED: 'true'
      GF_PANELS_ENABLE_ALPHA: 'true'
    volumes:
      - ../docker/services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - planetmoondrop

  # # ── Promtail — scrapes container stdout/stderr → Loki ─────────────────────
  # promtail:
  #   image: grafana/promtail:2.9.3
  #   container_name: promtail
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ../docker/services/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
  #     - promtail-positions:/tmp
  #   command: -config.file=/etc/promtail/config.yaml
  #   depends_on:
  #     loki:
  #       condition: service_healthy
  #   networks:
  #     - planetmoondrop

  # ── auth-service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ..
      dockerfile: examples/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    labels:
      app: auth-service
      env: development
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - planetmoondrop

  # ── customer-support ──────────────────────────────────────────────────────
  customer-support:
    build:
      context: ..
      dockerfile: examples/customer-support/Dockerfile
    container_name: customer-support
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    labels:
      app: customer-support
      env: development
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - planetmoondrop

  # ── backend (gateway) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: examples/backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
      AUTH_SERVICE_URL: http://auth-service:3001
      SUPPORT_SERVICE_URL: http://customer-support:3002
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:3000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    labels:
      app: backend
      env: development
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      auth-service:
        condition: service_started
      customer-support:
        condition: service_started
    networks:
      - planetmoondrop

  # ── frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: examples/frontend/Dockerfile
      args:
        # Baked into the Next.js bundle at build time.
        # Must be host-accessible URLs — browser runs on the host, not in Docker.
        NEXT_PUBLIC_API_URL: http://localhost:3003/api
        NEXT_PUBLIC_TRACE_VIEWER: http://localhost:3003/_trace
    container_name: frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - backend
    networks:
      - planetmoondrop

  # ── Archive exporter — twice-daily gzip archives of all Loki logs ─────────
  # Runs two cron jobs per day (UTC):
  #   00:05 — exports yesterday's PM window (12:00–24:00) as YYYY-MM-DD-pm.jsonl.gz
  #   12:05 — exports today's    AM window  (00:00–12:00) as YYYY-MM-DD-am.jsonl.gz
  # Archives land in ./docker/archive/logs/ on the host.
  archive-exporter:
    build:
      context: ../docker/services/archive-exporter
      dockerfile: Dockerfile
    container_name: archive-exporter
    restart: unless-stopped
    environment:
      LOKI_HOST: http://loki:3100
      ARCHIVE_DIR: /archive
      LOG_LIMIT: '5000'
    volumes:
      - ../docker/services/archive/logs:/archive
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - planetmoondrop

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  promtail-positions:

networks:
  planetmoondrop:
    driver: bridge
