# docker compose up --build
#
# Starts the full stack — observability infra + all four example apps.
# Build context for every app service is the repo root (..) so that
# file:../../packages/* references resolve inside Docker.
#
# Ports exposed on the host:
#   5173  frontend
#   3003  backend (gateway)
#   3001  auth-service
#   3002  customer-support
#   3000  Grafana
#   3100  Loki
#   3200  Tempo
#   9090  Prometheus

version: '3.9'

services:
  # ── Observability: Loki ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - moondrop

  # ── Observability: Tempo ───────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '3200:3200'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ../docker/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - moondrop

  # ── Observability: Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - moondrop

  # ── Observability: Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: correlations traceToMetrics
      GF_EXPLORE_ENABLED: 'true'
      GF_PANELS_ENABLE_ALPHA: 'true'
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - moondrop

  # ── Promtail — scrapes container stdout/stderr → Loki ─────────────────────
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - moondrop

  # ── auth-service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ..
      dockerfile: examples/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
    labels:
      app: auth-service
      env: development
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - moondrop

  # ── customer-support ──────────────────────────────────────────────────────
  customer-support:
    build:
      context: ..
      dockerfile: examples/customer-support/Dockerfile
    container_name: customer-support
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
    labels:
      app: customer-support
      env: development
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - moondrop

  # ── backend (gateway) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: examples/backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      LOKI_HOST: http://loki:3100
      AUTH_SERVICE_URL: http://auth-service:3001
      SUPPORT_SERVICE_URL: http://customer-support:3002
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:3000'
    labels:
      app: backend
      env: development
    depends_on:
      loki:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-support:
        condition: service_started
    networks:
      - moondrop

  # ── frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: examples/frontend/Dockerfile
      args:
        # Baked into the Next.js bundle at build time.
        # Must be host-accessible URLs — browser runs on the host, not in Docker.
        NEXT_PUBLIC_API_URL: http://localhost:3003/api
        NEXT_PUBLIC_TRACE_VIEWER: http://localhost:3003/_trace
    container_name: frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - backend
    networks:
      - moondrop

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  promtail-positions:

networks:
  moondrop:
    driver: bridge
