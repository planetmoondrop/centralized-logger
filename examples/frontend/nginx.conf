server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve all routes from index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
