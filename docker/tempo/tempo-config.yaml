stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# ── Distributor ───────────────────────────────────────────────────────
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# ── Ingester ─────────────────────────────────────────────────────────
ingester:
  max_block_duration: 5m
  trace_idle_period: 10s
  flush_check_period: 10s

# ── Compactor ─────────────────────────────────────────────────────────
compactor:
  ring:
    kvstore:
      store: memberlist

# ── Storage ───────────────────────────────────────────────────────────
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000

# ── Retention (moved here in Tempo 2.x) ──────────────────────────────
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 10000
    global:
      max_bytes_per_trace: 5000000
    compaction:
      block_retention: 48h # How long to keep traces
