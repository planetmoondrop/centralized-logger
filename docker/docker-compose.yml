version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Planetmoondrop Observability Stack
#   loki        → Log aggregation              http://localhost:3100
#   tempo       → Distributed trace storage    http://localhost:3200
#   prometheus  → Metrics collection           http://localhost:9090
#   grafana     → Dashboard UI                 http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Grafana Loki — log aggregation ─────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./services/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - planetmoondrop-logger

  # ── Grafana Tempo — distributed trace store ─────────────────────────────────
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '${TEMPO_HTTP_PORT:-3200}:3200' # Tempo HTTP API  (Grafana datasource)
      - '${TEMPO_OTLP_GRPC_PORT:-4317}:4317' # OTLP gRPC receiver
      - '${TEMPO_OTLP_HTTP_PORT:-4318}:4318' # OTLP HTTP receiver  ← services send spans here
    volumes:
      - ./services/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - planetmoondrop-logger

  # ── Prometheus — metrics scraper ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets.yaml:/etc/prometheus/targets.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planetmoondrop-logger

  # ── Grafana UI ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.7
    container_name: grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-changeme}'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: correlations traceToMetrics
      GF_EXPLORE_ENABLED: 'true'
      GF_PANELS_ENABLE_ALPHA: 'true'
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - planetmoondrop-logger
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started

  # ── Archive exporter — twice-daily gzip archives of all Loki logs ─────────
  archive-exporter:
    build:
      context: ./services/archive-exporter
      dockerfile: Dockerfile
    container_name: archive-exporter
    restart: unless-stopped
    environment:
      LOKI_HOST: http://loki:3100
      ARCHIVE_DIR: '${ARCHIVE_DIR:-/archive}'
      LOG_LIMIT: '${LOG_LIMIT:-5000}'
    volumes:
      - ./services/archive/logs:/archive
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - planetmoondrop-logger

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  planetmoondrop-logger:
    driver: bridge
