version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Full local observability stack:
#   auth-service    (Docker, port 3001)
#   business-service(Docker, port 3002)
#   loki            Log aggregation
#   promtail        Docker log collector → Loki
#   tempo           Distributed trace storage
#   grafana         Dashboard UI  →  http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Grafana Loki ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - moondrop-logger

  # # ── Promtail (reads Docker container stdout/stderr → Loki) ──────────
  # promtail:
  #   image: grafana/promtail:2.9.3
  #   container_name: promtail
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
  #     - promtail-positions:/tmp
  #   command: -config.file=/etc/promtail/config.yaml
  #   networks:
  #     - moondrop-logger
  #   depends_on:
  #     - loki

  # ── Grafana Tempo (distributed tracing) ────────────────────────────
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '3200:3200' # Tempo HTTP API
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP HTTP receiver
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - moondrop-logger

  # ── Grafana UI ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: correlations
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - moondrop-logger
    depends_on:
      - loki
      - tempo

volumes:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  moondrop-logger:
    driver: bridge
