server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

# Tracks log positions so restarts don't re-ship old lines
positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Retry configuration — ensures no log loss on transient Loki issues
    backoff_config:
      min_period:  500ms
      max_period:  5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  # ── Docker container log scraping ─────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only tail containers that have an 'app' Docker label
          - name: label
            values: ["app"]

    relabel_configs:
      # Promote the Docker 'app' label → Loki 'app' index label
      - source_labels: [__meta_docker_container_label_app]
        target_label: app

      # Promote the Docker 'env' label → Loki 'env' index label
      - source_labels: [__meta_docker_container_label_env]
        target_label: env

      # Include the full container name for debugging
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      # ── 1. Parse the JSON log line emitted by winston ──────────────
      - json:
          expressions:
            traceId:    traceId
            level:      level
            context:    context
            userId:     userId
            statusCode: statusCode
            duration:   duration

      # ── 2. Promote parsed fields → Loki index labels ───────────────
      # Only high-cardinality-safe fields should be labels.
      # traceId and userId are HIGH cardinality — they are kept as
      # structured metadata (not labels) so Loki can filter them with
      # | json | traceId = "..." without blowing up the label index.
      - labels:
          level:        # Low cardinality ✓ — safe as label
          context:      # Medium cardinality ✓ — safe as label

      # ── 3. Set log timestamp from the JSON 'timestamp' field ────────
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - UnixMs

      # ── 4. Drop health-check noise ──────────────────────────────────
      - drop:
          expression: ".*(GET /health|GET /metrics|GET /favicon).*"
          drop_counter_reason: health_check_noise
