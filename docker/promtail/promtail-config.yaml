server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period:  500ms
      max_period:  5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  # ── Docker container log scraping ─────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["app"]

    relabel_configs:
      # app and env from Docker labels → Loki stream labels
      - source_labels: [__meta_docker_container_label_app]
        target_label: app
      - source_labels: [__meta_docker_container_label_env]
        target_label: env
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      # ── 1. Parse the JSON log line emitted by winston ────────────────────
      - json:
          expressions:
            # Low-cardinality fields → will become Loki stream labels
            level:        level
            logType:      logType
            context:      context
            # High-cardinality fields → extracted but NOT promoted to labels.
            # They are indexed by TSDB at query time via | json.
            # This keeps the Loki label index small while still allowing fast
            # filtering: {app="auth-service"} | json | traceId = "abc123"
            traceId:      traceId
            spanId:       spanId
            parentSpanId: parentSpanId
            userId:       userId
            method:       method
            path:         path
            statusCode:   statusCode
            duration:     duration
            service:      service

      # ── 2. Promote ONLY low-cardinality fields to Loki stream labels ─────
      # Rule of thumb: < ~1000 distinct values globally is safe as a label.
      # level:   4 values    ✓
      # logType: 7 values    ✓
      # context: ~20 values  ✓
      # app:     set by Docker label relabelling above  ✓
      - labels:
          level:
          logType:
          context:

      # ── 3. Normalise timestamp from winston's timestamp field ────────────
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - UnixMs

      # ── 4. Drop high-frequency noise that pollutes dashboards ───────────
      - drop:
          expression: ".*(GET /health|GET /healthz|GET /metrics|GET /favicon|HEAD /).*"
          drop_counter_reason: health_probe_noise
